services:
  backend:
    image: ${BACKEND_IMAGE:-zkq-backend:local}
    build: ./backend
    environment:
      HTTP_ADDR: :8080
      DB_PATH: /app/data/zkq.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes: [zkq-data:/app/data]
    ports: ["8080:8080"]
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:-zkq-web:local}
    build: ./web
    depends_on: [backend]
    ports: ["5173:80"]
    restart: unless-stopped
volumes:
  zkq-data:
